name: Bayesian UQ
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest --junitxml=public-tests.xml
      - run: python validation/run_tests.py --report reference-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uq-results-${{ matrix.python }}
          path: |
            public-tests.xml
            reference-tests.json
