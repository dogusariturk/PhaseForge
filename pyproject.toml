[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseforge-uq"
version = "0.1.0.dev0"
description = "Optional Bayesian fixed-configuration Gibbs-model fitting for PhaseForge"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "sympy>=1.13,<2", "pycalphad>=0.11.2,<0.12"]
license = "GPL-3.0-or-later"

[project.scripts]
phaseforge-uq = "phaseforge_uq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phaseforge_uq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
